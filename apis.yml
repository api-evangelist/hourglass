name: Hourglass
description: >-
  Hourglass is a DeFi protocol and time-bound token (TBT) infrastructure that
  invented a primitive for tokenizing staked, locked, or time-committed on-chain
  assets, letting holders trade their place in a lock-up queue for early
  liquidity. Its products include an RFQ marketplace built on OpenSea's Seaport
  for trading time-bound tokens, non-custodial on-chain vaults (including the
  Pre-iUSDT stable vault and the sunset Hourglass Boost product), and
  institutional-grade yield infrastructure that bridges on-chain DeFi capital
  with traditional capital markets. TBTs are semi-fungible ERC-1155 tokens
  issued by Hourglass custodian smart contracts on Ethereum. Launch partners
  included Lido, Frax, and Convex. Founded in 2022 and backed by a $4.2M seed
  round led by Electric Capital, with Coinbase Ventures, Circle Ventures, and
  others participating.
